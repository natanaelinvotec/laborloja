<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — LaborLoja</title>
<meta name="robots" content="noindex">
<script>
// Endereços do site antigo (WordPress/WooCommerce) → páginas novas.
// Ex.: /product/standard-m10/            → produto.html?p=standard-m10
//      /product-category/point-of-care/  → produtos.html?cat=point-of-care
(function () {
  var base = location.pathname.indexOf("/laborloja/") === 0 ? "/laborloja/" : "/";
  var caminho = location.pathname.slice(base.length).replace(/\/+$/, "");
  var partes = caminho.split("/");
  var ultimo = partes[partes.length - 1];
  var destino = null;
  if (partes[0] === "product" && partes[1]) destino = "produto.html?p=" + encodeURIComponent(partes[1]);
  else if (partes[0] === "product-category" && ultimo) destino = "produtos.html?cat=" + encodeURIComponent(ultimo);
  else if (/^(shop|shop-2|loja|sales)$/.test(caminho)) destino = "produtos.html";
  else if (/^(quem-somos-nos|quem-somos)$/.test(caminho)) destino = "pagina.html?p=quem-somos";
  else if (/^politica-de-privacidade$/.test(caminho)) destino = "pagina.html?p=politica-de-privacidade";
  else if (/^(contato|contact)$/.test(caminho)) destino = "pagina.html?p=contato";
  else if (/^(wishlist|wishlist-2|cart|cart-2|checkout|checkout-2)$/.test(caminho)) destino = "orcamento.html";
  else if (/^(wp-admin|wp-login\.php)/.test(caminho)) destino = "admin/";
  else if (/^\?s=/.test(location.search) || new URLSearchParams(location.search).get("s")) destino = "produtos.html?q=" + encodeURIComponent(new URLSearchParams(location.search).get("s") || "");
  if (destino) location.replace(base + destino);
  else document.addEventListener("DOMContentLoaded", function () { document.getElementById("inicio").href = base; });
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f4f6f9;color:#0d1530;padding:16px;text-align:center}
  h1{font-size:28px;margin:0 0 8px} p{color:#5f6b76;margin:0 0 22px}
  a{display:inline-block;background:#0000ff;color:#fff;text-decoration:none;padding:12px 22px;border-radius:6px;font-weight:600}
</style>
</head>
<body>
<main><h1>Página não encontrada</h1><p>O endereço que você abriu não existe mais.</p><a id="inicio" href="/">Ir para a página inicial</a></main>
</body>
</html>
